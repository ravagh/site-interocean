<script>
  /* Runs before first paint: enables JS-only styles without layout shift.
     .motion is only added when the visitor hasn't asked for reduced motion.
     Failsafe: if the main bundle never boots, content is revealed after 3.5s. */
  (function (d) {
    var html = d.documentElement;
    html.classList.add('js');
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!reduce) html.classList.add('motion');
    window.setTimeout(function () {
      if (!window.__interOceanReady) html.classList.remove('motion');
    }, 3500);
  })(document);
</script>
